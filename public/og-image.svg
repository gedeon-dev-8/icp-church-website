<?xml version="1.0" encoding="UTF-8"?>
<!--
  Open Graph preview image — 1200×630.
  Pure SVG so it renders crisp on any density. If a photographer's
  shot of the sanctuary becomes available, replace this file with a
  PNG/JPG (same filename, change extension and the index.html meta).
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200" height="630"
  viewBox="0 0 1200 630"
  role="img"
  aria-label="International Church of Pretoria"
>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#06100f"/>
      <stop offset="55%"  stop-color="#050a0a"/>
      <stop offset="100%" stop-color="#020404"/>
    </linearGradient>
    <radialGradient id="glow1" cx="22%" cy="28%" r="42%">
      <stop offset="0%"   stop-color="#1ad8d8" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#1ad8d8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="82%" cy="76%" r="38%">
      <stop offset="0%"   stop-color="#d4b682" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d4b682" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Backdrop -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Thin frame -->
  <rect
    x="40" y="40" width="1120" height="550"
    fill="none"
    stroke="#1ad8d8"
    stroke-opacity="0.30"
    stroke-width="1"
  />

  <!-- Top eyebrow line + dot -->
  <g transform="translate(80, 100)">
    <line x1="0" y1="0" x2="44" y2="0" stroke="#1ad8d8" stroke-width="1.2"/>
    <text
      x="60" y="5"
      font-family="'Cinzel', 'Times New Roman', serif"
      font-size="14"
      letter-spacing="6"
      fill="#1ad8d8"
      font-weight="600"
    >ESTABLISHED · PRETORIA · 1993</text>
  </g>

  <!-- Title -->
  <g transform="translate(80, 240)">
    <text
      font-family="'Cormorant Garamond', Georgia, serif"
      font-size="92"
      fill="#ecf8f7"
      font-weight="300"
      letter-spacing="-2"
    >International Church</text>
    <text
      x="0" y="100"
      font-family="'Cormorant Garamond', Georgia, serif"
      font-size="92"
      fill="#ecf8f7"
      font-weight="300"
      letter-spacing="-2"
    >of <tspan fill="#1ad8d8" font-style="italic">Pretoria</tspan></text>
  </g>

  <!-- Subtitle -->
  <text
    x="80" y="486"
    font-family="'DM Sans', system-ui, sans-serif"
    font-size="22"
    fill="#b9d2d0"
    font-weight="300"
  >A family of believers united around one truth — the Word of God.</text>

  <!-- Bottom service badge -->
  <g transform="translate(80, 540)">
    <rect width="240" height="36" fill="none" stroke="#1ad8d8" stroke-opacity="0.45"/>
    <text
      x="120" y="24"
      text-anchor="middle"
      font-family="'Cinzel', 'Times New Roman', serif"
      font-size="11"
      letter-spacing="4"
      fill="#1ad8d8"
      font-weight="600"
    >SUNDAYS · 09:00</text>
  </g>

  <!-- Cross monogram, top-right -->
  <g transform="translate(1080, 100)" stroke="#d4b682" stroke-width="1.4" fill="none" opacity="0.55">
    <line x1="0" y1="-26" x2="0" y2="26"/>
    <line x1="-14" y1="-6" x2="14" y2="-6"/>
    <circle cx="0" cy="0" r="34" stroke="#1ad8d8" stroke-opacity="0.35"/>
  </g>

  <!-- icpretoria.org tag, bottom-right -->
  <text
    x="1120" y="566"
    text-anchor="end"
    font-family="'DM Sans', system-ui, sans-serif"
    font-size="14"
    letter-spacing="3"
    fill="#b9d2d0"
    fill-opacity="0.78"
  >icpretoria.org</text>
</svg>

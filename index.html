  <!-- Link-preview image. The rasterised JPG is the primary; older
       scrapers (Facebook, some chat apps) prefer raster. The SVG is
       declared as a secondary asset for crawlers that respect vector.
       Both files are generated from public/og-image.svg — `npm run og`
       regenerates them, and `npm run build` does it automatically. -->
  <meta property="og:image" content="/og-image.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />

  <!-- Favicons — every file lives under /public/favicon/, which Vite
       serves at /favicon/<file>. The %PUBLIC_URL% token is a

  <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />

  <!-- ─── Google Analytics 4 ───────────────────────────────────────
       Measurement ID lives in VITE_GA_MEASUREMENT_ID (.env). The
       Vite plugin substitutes %VITE_GA_MEASUREMENT_ID% at build time.
       When the value is empty (e.g. local dev or preview branches),
       the bootstrap below short-circuits and never loads gtag.js —
       so analytics stays opt-in via env.

       Get your G-XXXXXXXXXX ID at https://analytics.google.com →
       Admin → Data Streams → your web stream.
  ──────────────────────────────────────────────────────────────── -->
  <script>
    window.__GA_ID__ = "%VITE_GA_MEASUREMENT_ID%";
    // Vite leaves the placeholder verbatim when the env var is unset,
    // so we treat the literal "%VITE_GA_MEASUREMENT_ID%" string as
    // "no ID configured" and skip the gtag bootstrap entirely.
    if (window.__GA_ID__ && window.__GA_ID__.indexOf("VITE_") === -1) {
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id=' + window.__GA_ID__;
      document.head.appendChild(s);

      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { window.dataLayer.push(arguments); };
      window.gtag('js', new Date());
      // send_page_view is left ON for the initial load; React Router
      // navigations are tracked manually via the RouteScrollManager.
      window.gtag('config', window.__GA_ID__, {
        anonymize_ip: true
      });
    }
  </script>
